<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>随心配套餐 - 选规格交互</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f0f0; color: #333; -webkit-font-smoothing: antialiased; }
  img { display: block; max-width: 100%; }

  .page { max-width: 375px; margin: 0 auto; background: #f5f5f5; min-height: 100vh; position: relative; padding-bottom: 60px; }

  .header { background: #faf6f0; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #f0ece6; }
  .header .back { font-size: 20px; color: #333; }
  .header .title { font-size: 15px; font-weight: 600; }
  .header .share { font-size: 12px; color: #999; }

  .pkg-info { background: #fff; padding: 14px 16px; }
  .pkg-name { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
  .pkg-desc { font-size: 11px; color: #999; margin-bottom: 6px; }
  .pkg-price { font-size: 11px; color: #999; }
  .pkg-price .num { font-size: 19px; font-weight: bold; color: #e84a3e; }
  .pkg-price .sym { font-size: 12px; color: #e84a3e; }

  .cat-wrap { display: flex; background: #fff; border-top: 1px solid #f0f0f0; }
  .cat-sidebar { width: 80px; flex-shrink: 0; background: #f9f9f9; }
  .cat-tab { padding: 14px 6px; text-align: center; font-size: 13px; color: #666; border-bottom: 1px solid #f0f0f0; position: relative; }
  .cat-tab .count { font-size: 10px; color: #e84a3e; display: block; margin-top: 2px; }
  .cat-tab.active { background: #fff; color: #6B2D2D; font-weight: bold; }
  .cat-tab.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: #6B2D2D; }
  .cat-tab.active .count { color: #6B2D2D; }

  .product-list { flex: 1; }
  .product-card { display: flex; gap: 10px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #f5f0f0; position: relative; cursor: pointer; transition: background 0.2s; }
  .product-card.sel { background: #faf5f3; }
  .pc-img { width: 70px; height: 70px; border-radius: 6px; background: #f9f5f0; display: flex; align-items: center; justify-content: center; font-size: 28px; flex-shrink: 0; }
  .pc-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .pc-name { font-size: 12px; color: #333; line-height: 1.4; font-weight: 500; }
  .pc-spec { font-size: 10px; color: #aaa; margin-top: 2px; }
  .pc-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
  .pc-price { font-size: 15px; font-weight: bold; color: #e84a3e; }
  .pc-price .sym { font-size: 10px; }

  .spec-btn { font-size: 10px; padding: 4px 12px; border-radius: 14px; cursor: pointer; white-space: nowrap; transition: all 0.2s; border: 1px solid #6B2D2D; color: #6B2D2D; background: transparent; }
  .spec-btn.added { background: #6B2D2D; color: #fff; }
  .spec-btn.disabled-btn { border-color: #ddd; color: #ccc; background: #f9f9f9; cursor: not-allowed; }

  .pc-sel-info { font-size: 10px; color: #6B2D2D; margin-top: 3px; line-height: 1.3; }
  .pc-sel-info .item { display: inline-block; background: #faf0f0; padding: 1px 6px; border-radius: 8px; margin-right: 4px; }

  .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 375px; margin: 0 auto; background: #fff; border-top: 1px solid #f0f0f0; display: flex; align-items: center; padding: 8px 12px; gap: 10px; z-index: 100; }
  .sel-count { font-size: 12px; color: #666; }
  .sel-count .n { color: #e84a3e; font-weight: bold; font-size: 14px; }
  .submit-btn { flex: 1; background: #6B2D2D; color: #fff; text-align: center; padding: 11px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: 500; }

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 200; display: none; justify-content: center; align-items: flex-end; }
  .modal-overlay.show { display: flex; }
  .modal { width: 100%; max-width: 375px; background: #fff; border-radius: 12px 12px 0 0; overflow: hidden; animation: slideUp 0.3s ease; max-height: 90vh; display: flex; flex-direction: column; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

  .modal-header { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
  .modal-header .title { font-size: 14px; font-weight: 600; }
  .modal-header .close { font-size: 22px; color: #999; cursor: pointer; line-height: 1; }

  .modal-body { display: flex; gap: 12px; padding: 14px 16px; flex-shrink: 0; }
  .modal-img { width: 90px; height: 90px; border-radius: 6px; background: #f9f5f0; display: flex; align-items: center; justify-content: center; font-size: 36px; flex-shrink: 0; }
  .modal-info { flex: 1; }
  .modal-name { font-size: 12px; color: #333; line-height: 1.4; margin-bottom: 6px; }
  .modal-price-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .modal-price { display: flex; align-items: baseline; gap: 2px; }
  .modal-price .sym { font-size: 12px; color: #e84a3e; }
  .modal-price .num { font-size: 20px; font-weight: bold; color: #e84a3e; }
  .eye-btn { border: none; background: transparent; cursor: pointer; padding: 4px; display: flex; align-items: center; border-radius: 4px; }
  .eye-btn svg { width: 18px; height: 18px; transition: all 0.3s; }
  .dealer-row { font-size: 12px; display: flex; align-items: baseline; gap: 4px; overflow: hidden; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 0; opacity: 0; }
  .dealer-row.show { max-height: 30px; opacity: 1; }
  .dealer-row .label { color: #999; }
  .dealer-row .sym { font-size: 11px; color: #e84a3e; }
  .dealer-row .num { font-size: 16px; font-weight: bold; color: #e84a3e; }

  .sku-section { padding: 0 16px 8px; flex: 1; overflow-y: auto; }

  .spec-group { margin-bottom: 14px; }
  .spec-group .group-label { font-size: 12px; color: #666; margin-bottom: 8px; font-weight: 500; }

  .sku-select-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .sku-opt { padding: 8px 16px; border: 1px solid #ddd; border-radius: 4px; font-size: 12px; color: #666; cursor: pointer; transition: all 0.2s; background: #fff; }
  .sku-opt.active { border-color: #6B2D2D; color: #6B2D2D; background: #faf0f0; }
  .sku-opt.disabled { opacity: 0.4; pointer-events: none; }

  .inline-sel-list { margin-bottom: 8px; min-height: 30px; }
  .isel-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: #faf9f5; border-radius: 6px; margin-bottom: 6px; animation: slideIn 0.3s ease; border: 1px solid #f0ece0; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .isel-row .info { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
  .isel-row .dot { width: 6px; height: 6px; border-radius: 50%; background: #6B2D2D; flex-shrink: 0; }
  .isel-row .size { font-size: 12px; color: #333; }
  .isel-row .del { font-size: 16px; color: #ccc; cursor: pointer; padding: 0 4px; flex-shrink: 0; }
  .isel-empty { font-size: 11px; color: #ccc; text-align: center; padding: 8px 0; }

  .stepper { display: flex; align-items: center; opacity: 1; pointer-events: auto; }
  .step-btn { width: 28px; height: 28px; border: 1px solid #ddd; background: #fafafa; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; }
  .step-btn:first-child { border-radius: 4px 0 0 4px; }
  .step-btn:last-child { border-radius: 0 4px 4px 0; }
  .step-num { width: 38px; height: 28px; border-top: 1px solid #ddd; border-bottom: 1px solid #ddd; text-align: center; font-size: 12px; line-height: 28px; border-left: none; border-right: none; }

  .modal-footer { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
  .modal-btn { flex: 1; text-align: center; padding: 11px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s; }
  .modal-btn.primary { background: #6B2D2D; color: #fff; }
  .modal-btn.primary.disabled { background: #ccc; color: #fff; cursor: not-allowed; }
  .modal-btn:active { opacity: 0.8; }

  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 6px; z-index: 300; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>

<div class="page">
  <div class="header">
    <span class="back">‹</span>
    <span class="title">随心配套餐详情</span>
    <span class="share">分享</span>
  </div>

  <div class="pkg-info">
    <div class="pkg-name">索菲亚·光年系列家具11件套</div>
    <div class="pkg-desc">沙发*1+茶几*1+餐桌*1+餐椅*4+床*2+床头柜*2</div>
    <div class="pkg-price">促销价 <span class="sym">¥</span><span class="num">1217</span></div>
  </div>

  <div class="cat-wrap">
    <div class="cat-sidebar">
      <div class="cat-tab">沙发<span class="count">3选1</span></div>
      <div class="cat-tab active" id="bedTab">床<span class="count" id="bedCount">4选2</span></div>
    </div>
    <div class="product-list" id="productList"></div>
  </div>

  <div class="bottom-bar">
    <div class="sel-count">已选 <span class="n" id="totalCount">0</span> 件</div>
    <div class="submit-btn" onclick="showToast('一键拆单')">一键拆单</div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span class="title">商品信息</span>
      <span class="close" onclick="closeModal()">×</span>
    </div>

    <div class="modal-body">
      <div class="modal-img" id="modalImg">🛏️</div>
      <div class="modal-info">
        <div class="modal-name" id="modalName">时尚款真皮床</div>
        <div class="modal-price-row">
          <div class="modal-price">
            <span class="sym">¥</span>
            <span class="num" id="modalPrice">109</span>
          </div>
          <button class="eye-btn" onclick="toggleEye()">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
              <line x1="3" y1="3" x2="21" y2="21"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="dealer-row" id="dealerRow">
          <span class="label">经销价</span>
          <span class="sym">¥</span>
          <span class="num" id="dealerPrice">22</span>
        </div>
      </div>
    </div>

    <div class="sku-section" id="skuSection"></div>

    <div class="modal-footer">
      <div class="modal-btn primary" id="confirmBtn" onclick="confirmSelection()">确认</div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  var maxCount = 2;
  var currentProductId = null;

  var productData = {
    p1: {
      name: '时尚款真皮床',
      price: 109,
      dealerPrice: 22,
      specGroups: [
        { name: '颜色', options: [{value:'咖啡',code:'C01'},{value:'米杏',code:'C02'},{value:'暗灰',code:'C03'}] },
        { name: '尺寸', options: [{value:'1.5m',code:'S01'},{value:'1.8m',code:'S02'}] }
      ]
    },
    p2: {
      name: '臻享真皮床',
      price: 120,
      dealerPrice: 45,
      specGroups: [
        { name: '颜色', options: [{value:'米杏',code:'C01'},{value:'咖啡',code:'C02'}] },
        { name: '尺寸', options: [{value:'1.8m',code:'S01'}] }
      ]
    },
    p3: {
      name: '马卡布艺床',
      price: 222,
      dealerPrice: 88,
      specGroups: [
        { name: '颜色', options: [{value:'白色',code:'C01'},{value:'暗灰',code:'C02'}] }
      ]
    },
    p4: {
      name: '索菲亚&麦风-安芯抗病毒软床',
      price: 222,
      dealerPrice: 90,
      specGroups: [
        { name: '颜色', options: [{value:'棕色',code:'C01'}] },
        { name: '尺寸', options: [{value:'1.5m',code:'S01'},{value:'1.8m',code:'S02'}] }
      ]
    }
  };

  var selectedSkus = [];
  var modalSelections = [];
  var selectedChips = {};
  var eyeOpen = false;

  function init() {
    renderProductCards();
  }

  function getGlobalTotal(excludePid) {
    return selectedSkus
      .filter(function(s) { return s.productId !== excludePid; })
      .reduce(function(s, i) { return s + i.qty; }, 0);
  }

  function getModalGlobalTotal() {
    var otherTotal = getGlobalTotal(currentProductId);
    var modalTotal = modalSelections.reduce(function(s, i) { return s + i.qty; }, 0);
    return otherTotal + modalTotal;
  }

  function getRemainingQuota() {
    return maxCount - getGlobalTotal(currentProductId);
  }

  function getSpecSummary(specs) {
    return Object.keys(specs).map(function(k) { return specs[k]; }).join(' ');
  }

  function renderProductCards() {
    var globalTotal = selectedSkus.reduce(function(s, i) { return s + i.qty; }, 0);
    var html = '';
    Object.keys(productData).forEach(function(pid) {
      var p = productData[pid];
      var items = selectedSkus.filter(function(s) { return s.productId === pid; });
      var totalQty = items.reduce(function(s, i) { return s + i.qty; }, 0);

      var cardSel = totalQty > 0 ? 'sel' : '';
      var atLimit = globalTotal >= maxCount && totalQty === 0;

      var btnClass, btnText, onclickAttr;
      if (totalQty > 0) {
        btnClass = 'spec-btn added';
        btnText = '已选' + totalQty;
        onclickAttr = 'openModal(\'' + pid + '\')';
      } else if (atLimit) {
        btnClass = 'spec-btn disabled-btn';
        btnText = '已达上限';
        onclickAttr = 'showLimitTip()';
      } else {
        btnClass = 'spec-btn';
        btnText = '选择规格';
        onclickAttr = 'openModal(\'' + pid + '\')';
      }

      var specLine = p.specGroups.map(function(g) {
        return g.name + ': ' + g.options.map(function(o) { return o.value; }).join('/');
      }).join('  ');

      var selInfo = '';
      if (items.length > 0) {
        selInfo = '<div class="pc-sel-info">';
        items.forEach(function(item) {
          selInfo += '<span class="item">' + getSpecSummary(item.specs) + '×' + item.qty + '</span>';
        });
        selInfo += '</div>';
      }

      html += '<div class="product-card ' + cardSel + '" onclick="' + onclickAttr + '">' +
        '<div class="pc-img">🛏️</div>' +
        '<div class="pc-info">' +
          '<div>' +
            '<div class="pc-name">' + p.name + '</div>' +
            '<div class="pc-spec">' + specLine + '</div>' +
            selInfo +
          '</div>' +
          '<div class="pc-bottom">' +
            '<div class="pc-price"><span class="sym">¥</span>' + p.price + '</div>' +
            '<span class="' + btnClass + '">' + btnText + '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
    });
    document.getElementById('productList').innerHTML = html;
  }

  function openModal(pid) {
    currentProductId = pid;
    var p = productData[pid];
    modalSelections = selectedSkus.filter(function(s) { return s.productId === pid; }).map(function(s) {
      return { specs: Object.assign({}, s.specs), code: s.code, label: s.label, qty: s.qty };
    });
    selectedChips = {};

    document.getElementById('modalName').textContent = p.name;
    document.getElementById('modalPrice').textContent = p.price;
    document.getElementById('dealerPrice').textContent = p.dealerPrice;

    eyeOpen = false;
    resetEye();
    renderSkuSection();
    updateConfirmBtn();
    document.getElementById('modalOverlay').classList.add('show');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('show');
  }

  function renderSkuSection() {
    if (!currentProductId) return;
    var p = productData[currentProductId];
    var remaining = getRemainingQuota();
    var html = '';

    // Render spec groups
    p.specGroups.forEach(function(g) {
      html += '<div class="spec-group">';
      html += '<div class="group-label">' + g.name + '</div>';
      html += '<div class="sku-select-grid">';
      g.options.forEach(function(opt) {
        var selVal = selectedChips[g.name];
        var active = selVal === opt.value ? 'active' : '';
        var disabled = (remaining <= 0 && !selVal && !modalSelections.some(function(m) {
          return Object.keys(m.specs).some(function(k) { return m.specs[k] === opt.value; });
        })) ? 'disabled' : '';
        html += '<div class="sku-opt ' + active + ' ' + disabled + '" onclick="selectChip(\'' + g.name + '\', \'' + opt.value + '\', \'' + opt.code + '\')">' + opt.value + '</div>';
      });
      html += '</div>';
      html += '</div>';
    });

    // Selected rows
    html += '<div class="inline-sel-list">';
    if (modalSelections.length === 0) {
      html += '<div class="isel-empty">请选择规格</div>';
    } else {
      modalSelections.forEach(function(m, idx) {
        html += '<div class="isel-row">' +
          '<div class="info"><span class="dot"></span><span class="size">' + m.label + '</span></div>' +
          '<div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">' +
            '<div class="stepper">' +
              '<div class="step-btn" onclick="stepQty(' + idx + ', -1)">−</div>' +
              '<div class="step-num">' + m.qty + '</div>' +
              '<div class="step-btn" onclick="stepQty(' + idx + ', 1)">+</div>' +
            '</div>' +
            '<span class="del" onclick="removeSku(' + idx + ')">×</span>' +
          '</div>' +
        '</div>';
      });
    }
    html += '</div>';

    document.getElementById('skuSection').innerHTML = html;
  }

  // Select a chip - when all dimensions selected, auto-create SKU row
  function selectChip(groupName, value, code) {
    if (selectedChips[groupName] === value) {
      delete selectedChips[groupName];
    } else {
      selectedChips[groupName] = value;
    }

    var p = productData[currentProductId];

    // Check if all dimensions are selected
    var allSelected = p.specGroups.every(function(g) { return selectedChips[g.name]; });

    if (allSelected) {
      var comboLabel = p.specGroups.map(function(g) { return selectedChips[g.name]; }).join(' ');
      var comboCode = p.specGroups.map(function(g) {
        var opt = g.options.find(function(o) { return o.value === selectedChips[g.name]; });
        return opt ? opt.code : '';
      }).join('-');

      var existing = modalSelections.find(function(m) { return m.label === comboLabel; });

      if (existing) {
        existing.qty += 1;
      } else {
        if (getModalGlobalTotal() >= maxCount) {
          showToast('已达上限，最多选' + maxCount + '件');
          delete selectedChips[groupName];
          renderSkuSection();
          updateConfirmBtn();
          return;
        }
        var specs = {};
        Object.keys(selectedChips).forEach(function(k) {
          specs[k] = selectedChips[k];
        });
        modalSelections.push({ specs: specs, code: comboCode, label: comboLabel, qty: 1 });
      }

      // Reset chips for next selection
      selectedChips = {};
    }

    renderSkuSection();
    updateConfirmBtn();
  }

  function stepQty(idx, delta) {
    var item = modalSelections[idx];
    if (!item) return;
    if (delta > 0 && getModalGlobalTotal() >= maxCount) {
      showToast('已达上限，最多选' + maxCount + '件');
      return;
    }
    item.qty = Math.max(1, item.qty + delta);
    renderSkuSection();
    updateConfirmBtn();
  }

  function removeSku(idx) {
    modalSelections.splice(idx, 1);
    renderSkuSection();
    updateConfirmBtn();
  }

  function updateConfirmBtn() {
    var globalTotal = getModalGlobalTotal();
    var btn = document.getElementById('confirmBtn');
    btn.textContent = '确认（' + globalTotal + '/' + maxCount + '）';
    btn.classList.remove('disabled');
  }

  function confirmSelection() {
    // Always allow confirm — even empty selections clear the product's confirmed data
    selectedSkus = selectedSkus.filter(function(s) { return s.productId !== currentProductId; });
    modalSelections.forEach(function(m) {
      selectedSkus.push({
        productId: currentProductId,
        specs: m.specs,
        code: m.code,
        label: m.label,
        qty: m.qty
      });
    });

    renderProductCards();
    updateCount();
    closeModal();
    if (modalSelections.length > 0) {
      showToast('已确认选择');
    } else {
      showToast('已取消选择');
    }
  }

  function showLimitTip() {
    showToast('已达选择上限（' + maxCount + '件），请先减少其他商品');
  }

  function toggleEye() {
    var eye = document.getElementById('eyeIcon');
    var dealerRow = document.getElementById('dealerRow');
    eyeOpen = !eyeOpen;
    if (eyeOpen) {
      eye.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="1.5" fill="#6B2D2D" stroke="none"/>';
      eye.setAttribute('stroke', '#6B2D2D');
      dealerRow.classList.add('show');
    } else {
      eye.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><line x1="3" y1="3" x2="21" y2="21"/><circle cx="12" cy="12" r="3"/>';
      eye.setAttribute('stroke', '#ccc');
      dealerRow.classList.remove('show');
    }
  }

  function resetEye() {
    var eye = document.getElementById('eyeIcon');
    var dealerRow = document.getElementById('dealerRow');
    eye.innerHTML = '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><line x1="3" y1="3" x2="21" y2="21"/><circle cx="12" cy="12" r="3"/>';
    eye.setAttribute('stroke', '#ccc');
    dealerRow.classList.remove('show');
  }

  function updateCount() {
    var total = selectedSkus.reduce(function(s, i) { return s + i.qty; }, 0);
    document.getElementById('totalCount').textContent = total;
    var bedTab = document.getElementById('bedCount');
    if (total > 0) {
      bedTab.textContent = '已选' + total + '/2';
    } else {
      bedTab.textContent = '4选2';
    }
  }

  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  init();
</script>
</body>
</html>
