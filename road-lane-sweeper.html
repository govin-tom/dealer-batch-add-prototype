    ctx.fillRect(-bw * 0.08, -bh / 2, bw * 0.16, bh);
    ctx.beginPath(); ctx.arc(0, -bh * 0.08, r * 0.22, 0, Math.PI * 2); ctx.fillStyle = '#ffd36e'; ctx.fill();
    ctx.strokeStyle = '#e0a93c'; ctx.lineWidth = Math.max(1, r * 0.06); ctx.stroke();
    ctx.restore();

    // 问号
    if (vs > 0.18) {
      ctx.font = '900 ' + Math.max(12, r * 1.15) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, r * 0.18); ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(60,30,90,0.85)';
      ctx.strokeText('?', p.x, cy);
      ctx.fillStyle = '#ffffff';
      ctx.fillText('?', p.x, cy);
    }
    ctx.restore();
  }

  function drawMissile(ms, t) {
    const p = proj(ms.x, ms.z);
    // 尺寸衰减比位置更平缓，远处导弹也保持足够存在感
    const vs = Math.max(0.62, Math.pow(p.vs, 0.55));
    const size = Math.max(42, 132 * vs);   // 体型放大，保证一眼可见
    const cy = p.y - 20 * p.vs;
    // 往远处猪群飞：按"从后方看"的姿态画，避免看起来像竖直向上飞
    const lean = clamp(ms.vx / CFG.missileSpeed, -1, 1) * 0.5;

    // 外发光（让远处也能一眼看到）
    const glow = ctx.createRadialGradient(p.x, cy, 0, p.x, cy, size * 1.8);
    glow.addColorStop(0, 'rgba(255,225,160,0.75)');
    glow.addColorStop(0.35, 'rgba(255,160,70,0.32)');
    glow.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(p.x, cy, size * 1.8, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(p.x, cy);
    ctx.rotate(lean);
    const bw2 = size * 0.30;

    // 尾焰：朝镜头方向喷出，向下扩散
    const f = 0.9 + Math.random() * 0.35;
    const fg = ctx.createLinearGradient(0, size * 0.10, 0, size * 1.55 * f);
    fg.addColorStop(0, 'rgba(255,252,225,1)');
    fg.addColorStop(0.35, 'rgba(255,200,90,0.92)');
    fg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-bw2 * 0.95, size * 0.12);
    ctx.quadraticCurveTo(0, size * 1.55 * f, bw2 * 0.95, size * 0.12);
    ctx.closePath(); ctx.fill();

    // 尾翼
    ctx.fillStyle = '#e24a6a';
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(sg * bw2 * 0.85, -size * 0.10);
      ctx.lineTo(sg * (bw2 + size * 0.24), size * 0.16);
      ctx.lineTo(sg * bw2 * 0.85, size * 0.30);
      ctx.closePath(); ctx.fill();
    }

    // 机体（透视缩短的短筒）
    const bh = size * 0.72;
    const bg = ctx.createLinearGradient(-bw2, 0, bw2, 0);
    bg.addColorStop(0, '#5d6f92');
    bg.addColorStop(0.42, '#dbe6f7');
    bg.addColorStop(1, '#7c8fb4');
    ctx.fillStyle = bg;
    roundRect(-bw2, -bh, bw2 * 2, bh + size * 0.10, bw2 * 0.55);
    ctx.fill();
    // 尾喷口
    ctx.fillStyle = '#39435c';
    ctx.beginPath();
    ctx.ellipse(0, size * 0.06, bw2 * 0.92, bw2 * 0.34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,240,190,0.9)';
    ctx.beginPath();
    ctx.ellipse(0, size * 0.06, bw2 * 0.5, bw2 * 0.18, 0, 0, Math.PI * 2);
    ctx.fill();
    // 远处弹头（红点）
    ctx.fillStyle = '#e24a6a';
    ctx.beginPath();
    ctx.ellipse(0, -bh * 0.98, bw2 * 0.62, size * 0.15, 0, 0, Math.PI * 2);
    ctx.fill();
    // 筒身高光
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    roundRect(-bw2 * 0.62, -bh * 0.9, bw2 * 0.34, bh * 0.8, bw2 * 0.17);
    ctx.fill();
    ctx.restore();
  }

  function drawMysteryOverlays(t) {
    // 盲盒揭晓大字提示
    if (S.toastTimer > 0 && S.toast) {
      const a = Math.min(1, S.toastTimer / 0.4) * Math.min(1, (1.5 - S.toastTimer > 0 ? 1 : 1));
      const pop = 1 + Math.max(0, (0.4 - S.toastTimer) * 1.2);
      ctx.save();
      ctx.globalAlpha = Math.min(1, S.toastTimer / 0.25);
      ctx.translate(W / 2, H * 0.16);
      ctx.scale(pop, pop);
      ctx.font = '900 ' + Math.min(58, W * 0.085) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineWidth = 10; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(20,30,60,0.85)';
      ctx.strokeText(S.toast, 0, 0);
      ctx.fillStyle = 'rgba(' + S.toastColor + ',1)';
      ctx.fillText(S.toast, 0, 0);
      ctx.restore();
    }
    // 状态指示器（右上）：狂暴 / 故障 / 黏脚
    const badges = [];
    if (S.frenzy > 0) badges.push({ icon: '🔥', t: S.frenzy, max: CFG.frenzyTime, color: '#ff9a5a' });
    if (S.fireJammed > 0) badges.push({ icon: '🔇', t: S.fireJammed, max: CFG.jamTime, color: '#9aa6c0' });
    if (S.slowMove > 0) badges.push({ icon: '😵', t: S.slowMove, max: CFG.slowTime, color: '#b07ad8' });
    if (badges.length === 0) return;
    ctx.save();
    let bx = W - 16, by = 72;
    for (const b of badges) {
      const w = 58, h = 52;
      bx -= w;
      ctx.fillStyle = 'rgba(255,255,255,0.88)';
      ctx.strokeStyle = b.color; ctx.lineWidth = 2.5;
      roundRect(bx, by, w, h, 10); ctx.fill(); ctx.stroke();
      ctx.font = '24px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(b.icon, bx + w / 2, by + 20);
      // 进度条
      const ratio = Math.max(0, Math.min(1, b.t / b.max));
      ctx.fillStyle = b.color;
      roundRect(bx + 8, by + 36, (w - 16) * ratio, 7, 3.5); ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1;
      roundRect(bx + 8, by + 36, w - 16, 7, 3.5); ctx.stroke();
      bx -= 8;
    }
    ctx.restore();
  }

  // ============================================================
  // 小猪猪绘制
  // ============================================================
  // 颜色向烧焦色混合（k=0 原色，k=1 全焦黑）
  function mixHex(hex, target, k) {
    const a = parseInt(hex.slice(1), 16);
    const tr = (target >> 16) & 255, tg = (target >> 8) & 255, tb = target & 255;
    const r = Math.round(((a >> 16) & 255) + (tr - ((a >> 16) & 255)) * k);
    const g = Math.round(((a >> 8) & 255) + (tg - ((a >> 8) & 255)) * k);
    const bl = Math.round((a & 255) + (tb - (a & 255)) * k);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
  }

  // 烧焦：把调色板压暗，并叠几块焦斑
  function applyBurn(pal, burnT) {
    if (burnT <= 0) return 0;
    const k = 0.75 * burnT;
    for (const key in pal) {
      if (typeof pal[key] === 'string' && pal[key].charAt(0) === '#') pal[key] = mixHex(pal[key], 0x2b221d, k);
    }
    return burnT;
  }

  function drawScorchSpots(cx, footY, R, bob, burnT) {
    if (burnT <= 0) return;
    const cy = footY + bob;
    const spots = [
      [-0.46, -0.62, 0.24], [0.34, -0.86, 0.18], [0.02, -0.28, 0.20],
      [-0.62, -0.05, 0.16], [0.44, 0.12, 0.22], [0.10, 0.34, 0.18],
    ];
    ctx.save();
    ctx.globalAlpha = 0.5 * burnT;
    ctx.fillStyle = '#171210';
    for (const s of spots) {
      ctx.beginPath();
      ctx.ellipse(cx + s[0] * R, cy + s[1] * R, R * s[2], R * s[2] * 0.78, s[0], 0, Math.PI * 2);
      ctx.fill();
    }
    // 余烬微光
    ctx.globalAlpha = (0.35 + Math.sin(performance.now() * 0.012) * 0.2) * burnT;
    ctx.fillStyle = 'rgb(255,120,40)';
    for (let i = 0; i < 3; i++) {
      const sx = cx + (i - 1) * R * 0.42, sy = cy - R * (0.75 - i * 0.18);
      ctx.beginPath(); ctx.arc(sx, sy, Math.max(1, R * 0.05), 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // 正面可爱小猪（参考图风格）：圆润豆形 + 大眼 + 粉耳 + 黑描边
  function drawCutePig(cx, footY, R, o) {
    const outline = o.outline || '#5a2a3c';
    const lw = Math.max(1, R * 0.052);
    const bw = R;
    const bh = R * 1.18;
    const cy = footY - bh * 0.97;

    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    // 腿
    const legW = R * 0.30, legH = R * 0.32;
    ctx.fillStyle = o.leg;
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw;
    roundRect(cx - R * 0.56, footY - legH, legW, legH, legW * 0.45);
    ctx.fill(); ctx.stroke();
    roundRect(cx + R * 0.26, footY - legH, legW, legH, legW * 0.45);
    ctx.fill(); ctx.stroke();

    // 耳朵（向外斜出轮廓，正面更明显）
    const earOuter = (sg) => {
      ctx.beginPath();
      ctx.moveTo(cx + sg * bw * 0.72, cy - bh * 0.30);
      ctx.quadraticCurveTo(cx + sg * bw * 1.34, cy - bh * 1.40, cx + sg * bw * 0.56, cy - bh * 1.10);
      ctx.quadraticCurveTo(cx + sg * bw * 0.40, cy - bh * 0.74, cx + sg * bw * 0.62, cy - bh * 0.34);
      ctx.closePath();
    };
    for (const sg of [-1, 1]) {
      earOuter(sg);
      ctx.fillStyle = o.ear;
      ctx.fill();
      ctx.strokeStyle = outline;
      ctx.lineWidth = lw;
      ctx.stroke();
    }
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(cx + sg * bw * 0.78, cy - bh * 0.44);
      ctx.quadraticCurveTo(cx + sg * bw * 1.16, cy - bh * 1.20, cx + sg * bw * 0.62, cy - bh * 1.00);
      ctx.quadraticCurveTo(cx + sg * bw * 0.52, cy - bh * 0.72, cx + sg * bw * 0.66, cy - bh * 0.46);
      ctx.closePath();
      ctx.fillStyle = o.earIn;
      ctx.fill();
    }

    // 身体
    const bg = ctx.createLinearGradient(cx, cy - bh, cx, cy + bh);
    bg.addColorStop(0, o.bodyTop);
    bg.addColorStop(0.55, o.body);
    bg.addColorStop(1, o.bodyDark);
    ctx.beginPath();
    ctx.ellipse(cx, cy, bw, bh, 0, 0, Math.PI * 2);
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw;
    ctx.stroke();

    // 顶部高光
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(cx, cy, bw, bh, 0, 0, Math.PI * 2);
    ctx.clip();
    const hl = ctx.createRadialGradient(
      cx - bw * 0.32, cy - bh * 0.60, 0,
      cx - bw * 0.32, cy - bh * 0.60, bw * 0.9
    );
    hl.addColorStop(0, 'rgba(255,255,255,0.5)');
    hl.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = hl;
    ctx.fillRect(cx - bw, cy - bh, bw * 2, bh * 2);
    ctx.restore();

    // 眼睛
    const eyeR = R * 0.158;
    const eyeY = cy - bh * 0.15;
    const eyeX = bw * 0.37;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + sg * eyeX, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = '#241018';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + sg * eyeX - eyeR * 0.30, eyeY - eyeR * 0.36, eyeR * 0.36, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
    }

    // 鼻子
    const noseRx = R * 0.31, noseRy = R * 0.23;
    const noseY = cy + bh * 0.24;
    ctx.beginPath();
    ctx.ellipse(cx, noseY, noseRx, noseRy, 0, 0, Math.PI * 2);
    ctx.fillStyle = o.nose;
    ctx.fill();
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw * 0.75;
    ctx.stroke();
    ctx.fillStyle = o.nostril;
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(cx + sg * noseRx * 0.40, noseY, noseRx * 0.15, noseRy * 0.32, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 腮红
    if (o.blush) {
      ctx.fillStyle = 'rgba(255,130,160,0.32)';
      for (const sg of [-1, 1]) {
        ctx.beginPath();
        ctx.ellipse(cx + sg * bw * 0.64, cy + bh * 0.10, R * 0.17, R * 0.11, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPig(m, t, elite) {
    const p = projPig(m.x, m.z);
    const vs = p.vs;
    const dying = m.hp <= 0;
    const fallT = dying ? Math.min(1, m.fall / 0.35) : 0;
    const bob = Math.sin(t * 6 + m.seed) * 5 * vs;
    const wobble = Math.sin(m.legPhase) * 0.045;
    const R = Math.min((elite ? 2.0 : 1) * 84 * vs, elite ? H * 0.22 : H * 0.17);

    ctx.save();
    if (dying) {
      ctx.globalAlpha = 1 - fallT;
      ctx.translate(p.x, p.y);
      ctx.scale(1 + fallT * 0.45, 1 - fallT * 0.8);
      ctx.translate(-p.x, -p.y);
    }

    // 影子
    ctx.globalAlpha = (dying ? (1 - fallT) : 1) * 0.28;
    ctx.fillStyle = '#3d4a3f';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + R * 0.06, R * 1.02, R * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = dying ? (1 - fallT) : 1;

    const flash = m.hitFlash > 0;
    const pal = elite
      ? { body:'#c56dd8', bodyTop:'#eab0f5', bodyDark:'#9a47ac', ear:'#b25cc6',
          earIn:'#f3cdf8', nose:'#a94cbd', nostril:'#5d2468', leg:'#9a47ac',
          outline:'#4a1f55', blush:false }
      : { body:'#ffa9bf', bodyTop:'#ffd9e4', bodyDark:'#ef7e97', ear:'#f58aa8',
          earIn:'#ffdfe7', nose:'#ef7295', nostril:'#8e3550', leg:'#eb8ba2',
          outline:'#5a2a3c', blush:true };

    // 高频射击时只提亮高光面，避免整只猪变成纯白
    if (flash) {
      pal.bodyTop = '#ffffff';
      pal.earIn = '#ffffff';
    }
    // 被闪电劈中：烧焦变黑 + 焦斑
    const burnT = m.burn > 0 ? Math.min(1, m.burn / CFG.burnTime) : 0;
    applyBurn(pal, burnT);

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(wobble);
    ctx.translate(-p.x, -p.y);
    drawCutePig(p.x, p.y + bob, R, pal);

    // 精英：金色小礼帽
    if (elite) {
      const bh = R * 1.18;
      const cy = p.y + bob - bh * 0.97;
      const hatY = cy - bh * 0.86;
      ctx.fillStyle = '#f7c948';
      ctx.strokeStyle = '#a97b12';
      ctx.lineWidth = Math.max(1, R * 0.05);
      ctx.beginPath();
      ctx.ellipse(p.x, hatY + R * 0.20, R * 0.64, R * 0.15, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(p.x - R * 0.36, hatY + R * 0.18);
      ctx.lineTo(p.x - R * 0.30, hatY - R * 0.40);
      ctx.quadraticCurveTo(p.x, hatY - R * 0.60, p.x + R * 0.30, hatY - R * 0.40);
      ctx.lineTo(p.x + R * 0.36, hatY + R * 0.18);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#e0507a';
      ctx.fillRect(p.x - R * 0.33, hatY + R * 0.02, R * 0.66, R * 0.12);
    }

    drawScorchSpots(p.x, p.y, R, bob, burnT);

    ctx.restore();
    ctx.restore();

    // 血条（白底圆角胶囊，避免深色底看起来像帽子）
    if (!dying && m.hp < m.maxHp && vs > 0.22) {
      const bwid = Math.max(30, R * 1.75);
      const bx = p.x - bwid / 2;
      const by = p.y - R * 2.92;
      const h = Math.max(5, 7 * vs);
      ctx.fillStyle = 'rgba(255,255,255,0.92)';
      roundRect(bx - 3, by - 3, bwid + 6, h + 6, (h + 6) / 2);
      ctx.fill();
      const ratio = clamp(m.hp / m.maxHp, 0, 1);
      // 用纯色代替每帧新建渐变（受伤猪多时能省下大量渐变对象）
      ctx.fillStyle = elite ? '#f7b733' : '#ff6f9c';
      roundRect(bx, by, Math.max(3, bwid * ratio), h, h / 2);
      ctx.fill();
    }
  }

  function drawBoss(m, t) {
    const p = projPig(m.x, m.z);
    const vs = p.vs;
    const dying = m.hp <= 0;
    const fallT = dying ? Math.min(1, m.fall / 0.35) : 0;
    const bob = Math.sin(t * 3.4) * 8 * vs;
    // 尺寸同时受"透视"和"不出屏"两个约束，越走近越大但头顶始终留在屏幕内
    const maxR = Math.max(36, (p.y - H * 0.07) / 2.7);
    const R = Math.min(84 * 4.8 * vs, maxR);
    const hpRatio = m.hp / m.maxHp;

    ctx.save();
    if (dying) {
      ctx.globalAlpha = 1 - fallT;
      ctx.translate(p.x, p.y);
      ctx.scale(1 + fallT * 0.5, 1 - fallT * 0.8);
      ctx.translate(-p.x, -p.y);
    }

    // 影子
    ctx.globalAlpha = (dying ? (1 - fallT) : 1) * 0.32;
    ctx.fillStyle = '#2c3630';
    ctx.beginPath();
    ctx.ellipse(p.x, p.y + R * 0.05, R * 1.05, R * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = dying ? (1 - fallT) : 1;

    // 血量越低越凶，配色分三阶段
    let pal;
    if (hpRatio > 0.5) {
      pal = { body:'#f7c74a', bodyTop:'#ffea9c', bodyDark:'#d9991a', ear:'#e9b23c',
              earIn:'#fff1bc', nose:'#c98412', nostril:'#6b3d00', leg:'#d9991a',
              outline:'#6b3d00', blush:false };
    } else if (hpRatio > 0.25) {
      pal = { body:'#f08a58', bodyTop:'#ffc79a', bodyDark:'#c95f30', ear:'#e07a48',
              earIn:'#ffd8b8', nose:'#b84e22', nostril:'#5e2208', leg:'#c95f30',
              outline:'#5e2208', blush:false };
    } else {
      pal = { body:'#e0554f', bodyTop:'#ff9a8f', bodyDark:'#a8302c', ear:'#d04a44',
              earIn:'#ffb8b0', nose:'#9c2824', nostril:'#4a0e0c', leg:'#a8302c',
              outline:'#4a0e0c', blush:false };
    }
    // BOSS 被高频射击，只做轻微提亮，避免整只变成纯白看不清
    if (m.hitFlash > 0) {
      pal.bodyTop = '#ffffff';
      pal.earIn = '#ffffff';
    }
    const burnT = m.burn > 0 ? Math.min(1, m.burn / CFG.burnTime) : 0;
    applyBurn(pal, burnT);
    const bh = R * 1.18;
    const cy = p.y + bob - bh * 0.97;

    drawCutePig(p.x, p.y + bob, R, pal);

    // 凶眉
    ctx.strokeStyle = '#3a1208';
    ctx.lineWidth = Math.max(2, R * 0.075);
    ctx.lineCap = 'round';
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(p.x + sg * R * 0.20, cy - bh * 0.34);
      ctx.lineTo(p.x + sg * R * 0.58, cy - bh * 0.22);
      ctx.stroke();
    }

    // 獠牙
    ctx.fillStyle = '#fffbe0';
    ctx.strokeStyle = '#b09a55';
    ctx.lineWidth = Math.max(1, R * 0.03);
    for (const sg of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(p.x + sg * R * 0.24, cy + bh * 0.38);
      ctx.lineTo(p.x + sg * R * 0.34, cy + bh * 0.20);
      ctx.lineTo(p.x + sg * R * 0.44, cy + bh * 0.38);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    }

    // 皇冠
    const hatY = cy - bh * 0.82;
    ctx.fillStyle = '#ffd54a';
    ctx.strokeStyle = '#a97b12';
    ctx.lineWidth = Math.max(1.5, R * 0.045);
    ctx.beginPath();
    ctx.moveTo(p.x - R * 0.62, hatY);
    ctx.lineTo(p.x - R * 0.62, hatY - R * 0.34);
    ctx.lineTo(p.x - R * 0.30, hatY - R * 0.08);
    ctx.lineTo(p.x, hatY - R * 0.46);
    ctx.lineTo(p.x + R * 0.30, hatY - R * 0.08);
    ctx.lineTo(p.x + R * 0.62, hatY - R * 0.34);
    ctx.lineTo(p.x + R * 0.62, hatY);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(p.x, hatY - R * 0.20, R * 0.085, 0, Math.PI * 2);
    ctx.fill();

    drawScorchSpots(p.x, p.y, R, bob, burnT);

    ctx.restore();

    // BOSS 血条
    const bwid = Math.max(180, Math.min(W * 0.72, 420 * vs));
    const bx = p.x - bwid / 2;
    const by = p.y - R * 2.55;
    const h = Math.max(8, 14 * vs);
    ctx.fillStyle = 'rgba(20,30,40,0.55)';
    roundRect(bx - 3, by - 3, bwid + 6, h + 6, 6);
    ctx.fill();
    const ratio = clamp(hpRatio, 0, 1);
    const g = ctx.createLinearGradient(bx, 0, bx + bwid, 0);
    g.addColorStop(0, '#e24a6a');
    g.addColorStop(0.5, '#ffb347');
    g.addColorStop(1, '#7bd96b');
    ctx.fillStyle = g;
    roundRect(bx, by, Math.max(2, bwid * ratio), h, 4);
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    roundRect(bx, by, bwid, h, 4);
    ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '800 ' + Math.max(12, 16 * vs) + 'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'bottom';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    const name = ['金甲猪王','野猪皇','钢铁猪神','终焉猪王'][Math.floor(S.levelCfg.num / 10) % 4];
    ctx.strokeText(name + '  BOSS', p.x, by - 6);
    ctx.fillText(name + '  BOSS', p.x, by - 6);
  }

  // ============================================================
  // 玩家
  // ============================================================
  function drawSoldier(sx, sy, size, alpha, t, seed, muzzle) {
    ctx.globalAlpha = alpha;

    // 影子
    ctx.fillStyle = 'rgba(20,45,70,0.20)';
    ctx.beginPath();
    ctx.ellipse(sx, sy, size * 0.24, size * 0.07, 0, 0, Math.PI * 2); ctx.fill();

    const outline = '#41536f';
    const lw = Math.max(1, size * 0.028);
    const headR = size * 0.29;
    const headCY = sy - size * 0.74;
    const bodyTop = sy - size * 0.56;
    const bodyBot = sy - size * 0.17;
    const bodyW = size * 0.29;
    const swing = Math.sin(t * 6 + seed) * size * 0.035;

    ctx.lineJoin = 'round';
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw;

    // 两条小短腿（前后小幅摆动）
    [-1, 1].forEach(function (sg, i) {
      const lx = sx + sg * bodyW * 0.32;
      const ly = sy - size * 0.075 + (i ? swing : -swing) * 0.5;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(lx, ly, size * 0.066, size * 0.082, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    });

    // 小手臂（左右各一，微微外张）
    [-1, 1].forEach(function (sg) {
      const ax = sx + sg * (bodyW * 0.5 + size * 0.035);
      const ay = sy - size * 0.42;
      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(sg * 0.42);
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.ellipse(0, 0, size * 0.075, size * 0.052, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    // 身体（白色圆润小身子 + 淡蓝渐变）
    const bg = ctx.createLinearGradient(0, bodyTop, 0, bodyBot);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(1, '#e6f0ff');
    ctx.fillStyle = bg;
    roundRect(sx - bodyW / 2, bodyTop, bodyW, bodyBot - bodyTop, bodyW * 0.46);
    ctx.fill(); ctx.stroke();

    // 大头
    const hg = ctx.createRadialGradient(
      sx - headR * 0.35, headCY - headR * 0.45, headR * 0.15,
      sx, headCY, headR * 1.15
    );
    hg.addColorStop(0, '#ffffff');
    hg.addColorStop(1, '#eef5ff');
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(sx, headCY, headR, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // 蓝色小披巾（压在脖子前，增加辨识度）
    ctx.fillStyle = '#2f7dff';
    ctx.beginPath();
    ctx.ellipse(sx, sy - size * 0.42, bodyW * 0.62, size * 0.052, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#1f5ecf';
    ctx.lineWidth = Math.max(1, size * 0.018);
    ctx.stroke();
    ctx.strokeStyle = outline;
    ctx.lineWidth = lw;

    // 眼睛（圆点 + 一点高光）
    const eyeY = headCY + size * 0.005;
    const eyeR = Math.max(1.2, size * 0.045);
    [-1, 1].forEach(function (sg) {
      ctx.fillStyle = '#2b3a55';
      ctx.beginPath();
      ctx.arc(sx + sg * headR * 0.40, eyeY, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.beginPath();
      ctx.arc(sx + sg * headR * 0.40 - eyeR * 0.28, eyeY - eyeR * 0.34, eyeR * 0.34, 0, Math.PI * 2);
      ctx.fill();
    });

    // 微笑
    ctx.strokeStyle = '#2b3a55';
    ctx.lineWidth = Math.max(1, size * 0.022);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(sx, headCY + size * 0.035, size * 0.062, Math.PI * 0.18, Math.PI * 0.82);
    ctx.stroke();

    // 腮红
    ctx.fillStyle = 'rgba(255,150,178,0.55)';
    [-1, 1].forEach(function (sg) {
      ctx.beginPath();
      ctx.ellipse(sx + sg * headR * 0.66, headCY + size * 0.075, size * 0.048, size * 0.030, 0, 0, Math.PI * 2);
      ctx.fill();
    });

    // 小手枪（右手，朝前上方）
    ctx.save();
    ctx.translate(sx + size * 0.13, sy - size * 0.30);
    ctx.rotate(-0.28);
    ctx.fillStyle = '#5b6f8f';
    ctx.strokeStyle = '#39485f';
    ctx.lineWidth = Math.max(1, size * 0.018);
    roundRect(0, -size * 0.036, size * 0.26, size * 0.072, size * 0.032);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#8fc0ff';
    roundRect(size * 0.20, -size * 0.020, size * 0.055, size * 0.040, size * 0.020);
    ctx.fill();
    ctx.restore();

    if (muzzle > 0) {
      ctx.globalAlpha = alpha * muzzle;
      const mx = sx + size * 0.38, my = sy - size * 0.375;
      const gg = ctx.createRadialGradient(mx, my, 0, mx, my, size * 0.28);
      gg.addColorStop(0, 'rgba(255,240,160,0.95)');
      gg.addColorStop(1, 'rgba(255,200,60,0)');
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(mx, my, size * 0.28, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    const rr = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + rr, y);
    ctx.arcTo(x + w, y, x + w, y + h, rr);
    ctx.arcTo(x + w, y + h, x, y + h, rr);
    ctx.arcTo(x, y + h, x, y, rr);
    ctx.arcTo(x, y, x + w, y, rr);
    ctx.closePath();
  }

  function drawPlayer(t) {
    const n = Math.min(S.characters, 9);
    const cols = n <= 1 ? 1 : (n <= 4 ? 2 : 3);
    const rows = Math.ceil(n / cols);
    const muzzle = S.mode === 'playing' ? 0.55 + 0.45 * Math.abs(Math.sin(t * 28)) : 0;
    const blink = S.invuln > 0 ? (Math.sin(S.time * 24) > 0 ? 0.35 : 1) : 1;

    for (let r = rows - 1; r >= 0; r--) {
      const rowCount = Math.min(cols, n - r * cols);   // 末排可能不满，按实际人数居中
      for (let c = 0; c < rowCount; c++) {
        const idx = r * cols + c;
        const offX = (c - (rowCount - 1) / 2) * 2.0;
        const offZ = r * 1.8;
        const p = proj(playerX + offX, CFG.playerZ + offZ);
        const size = 70 * p.vs * (n > 4 ? 0.84 : 1);
        drawSoldier(p.x, p.y, size, blink, t, idx * 1.7, idx === 0 ? muzzle : muzzle * 0.7);
      }
    }

    // 光圈
    const pp = proj(playerX, CFG.playerZ);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = 'rgba(47,125,255,0.25)';
    ctx.beginPath();
    ctx.ellipse(pp.x, pp.y, 70 * pp.vs, 22 * pp.vs, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    if (S.characters > 1) {
      const pb = proj(playerX, CFG.playerZ + (rows - 1) * 1.8);
      const ly = pb.y - 94 * pb.vs;
      ctx.save();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 12px "PingFang SC","Microsoft YaHei",sans-serif';
      const txt = '×' + S.characters;
      const tw = ctx.measureText(txt).width + 16;
      ctx.fillStyle = '#fff';
      roundRect(pp.x - tw / 2, ly - 9, tw, 18, 9); ctx.fill();
      ctx.strokeStyle = '#2f7dff'; ctx.lineWidth = 2;
      roundRect(pp.x - tw / 2, ly - 9, tw, 18, 9); ctx.stroke();
      ctx.fillStyle = '#2f7dff';
      ctx.fillText(txt, pp.x, ly + 1);
      ctx.restore();
    }
  }

  function drawParticles() {
    for (const p of particles) {
      const a = clamp(p.life / p.max, 0, 1);
      if (p.ring) {
        // 扩散冲击波光圈
        const r = p.size + (p.ringGrow || 0) * (1 - a);
        ctx.globalAlpha = a * 0.85;
        ctx.strokeStyle = 'rgba(' + p.color + ',1)';
        ctx.lineWidth = Math.max(1, (p.lw || 4) * a);
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.stroke();
        continue;
      }
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(' + p.color + ',1)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.6, p.size * a), 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBolts() {
    for (const b of bolts) {
      const a = clamp(b.life / b.max, 0, 1);
      const flick = 0.8 + Math.random() * 0.2;
      const path = (pts) => {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
      };
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      // 金色光晕
      path(b.pts);
      ctx.strokeStyle = 'rgba(255,180,50,' + (0.42 * a * flick).toFixed(3) + ')';
      ctx.lineWidth = 30;
      ctx.stroke();
      // 金色主干
      path(b.pts);
      ctx.strokeStyle = 'rgba(255,214,90,' + (0.92 * a * flick).toFixed(3) + ')';
      ctx.lineWidth = 11;
      ctx.stroke();
      // 白色芯
      path(b.pts);
      ctx.strokeStyle = 'rgba(255,255,238,' + (0.98 * a).toFixed(3) + ')';
      ctx.lineWidth = 4;
      ctx.stroke();
      // 分叉
      if (b.fork) {
        path(b.fork);
        ctx.strokeStyle = 'rgba(255,206,80,' + (0.8 * a * flick).toFixed(3) + ')';
        ctx.lineWidth = 5;
        ctx.stroke();
        path(b.fork);
        ctx.strokeStyle = 'rgba(255,255,230,' + (0.9 * a).toFixed(3) + ')';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawFloaters() {
    for (const f of floaters) {
      const a = clamp(f.life / f.max, 0, 1);
      const fx = clamp(f.x, 60, W - 60);
      ctx.globalAlpha = a;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '800 ' + f.size + 'px "PingFang SC","Microsoft YaHei",sans-serif';
      ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(0,0,0,0.55)';
      ctx.strokeText(f.text, fx, f.y);
      ctx.fillStyle = 'rgba(' + f.color + ',1)';
      ctx.fillText(f.text, fx, f.y);
    }
    ctx.globalAlpha = 1;
  }

  // 环境飘落的花瓣 / 光尘，让画面更有生气
  function drawAmbient(t) {
    ctx.save();
    for (let i = 0; i < 20; i++) {
      const sd = i * 7.31;
      const speedX = 10 + (i % 5) * 6;
      const speedY = 16 + (i % 3) * 8;
      const x = (((Math.sin(sd) * 0.5 + 0.5) * W + t * speedX) % (W + 90)) - 45;
      const y = (((Math.cos(sd * 1.7) * 0.5 + 0.5) * H * 0.9 + t * speedY) % (H + 70)) - 35;
      const r = 2 + (i % 4) * 1.3;
      ctx.globalAlpha = 0.14 + 0.20 * Math.abs(Math.sin(t * 0.7 + i));
      ctx.fillStyle = i % 3 === 0 ? 'rgba(255,240,190,1)' : 'rgba(255,205,225,1)';
      ctx.beginPath();
      ctx.ellipse(x, y, r, r * 0.6, Math.sin(t * 0.8 + i) * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawVignette() {
    ctx.fillStyle = vignetteGrad; ctx.fillRect(0, 0, W, H);
  }

  // ============================================================
  // 输入
  // ============================================================
  function pointerWorldX(clientX) {
    const rect = cvs.getBoundingClientRect();
    const px = clientX - rect.left;
    const wx = (px - W / 2) / PX;
    return clamp(wx, -CFG.roadHalf * 0.92, CFG.roadHalf * 0.92);
  }
  // 触屏拖动：优先走 touch 事件（微信 X5 / iOS / 旧安卓对 pointermove 支持不一致）
  let touchDragging = false;
  function touchToX(e) {
    if (!e.touches || !e.touches.length) return null;
    return pointerWorldX(e.touches[0].clientX);
  }
  cvs.addEventListener('touchstart', (e) => {
    ensureAudio();
    if (S.mode !== 'playing') return;
    const x = touchToX(e);
    if (x === null) return;
    touchDragging = true;
    playerTargetX = x;
    e.preventDefault();
  }, { passive: false });
  cvs.addEventListener('touchmove', (e) => {
    if (!touchDragging) return;
    const x = touchToX(e);
    if (x === null) return;
    if (S.mode === 'playing') playerTargetX = x;
    e.preventDefault();
  }, { passive: false });
  const endTouch = () => { touchDragging = false; };
  cvs.addEventListener('touchend', endTouch);
  cvs.addEventListener('touchcancel', endTouch);
  cvs.addEventListener('contextmenu', (e) => e.preventDefault());

  // 鼠标 / 触控笔（触屏交给上面的 touch 事件，避免重复处理）
  cvs.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'touch') return;
    if (S.mode !== 'playing') return;
    playerTargetX = pointerWorldX(e.clientX);
  });
  cvs.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') return;
    ensureAudio();
    if (S.mode === 'playing') {
      playerTargetX = pointerWorldX(e.clientX);
      // 捕获指针：拖出画布也继续跟随
      if (cvs.setPointerCapture) { try { cvs.setPointerCapture(e.pointerId); } catch (err) {} }
    }
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { keys.left = false; playerTargetX = playerX; }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { keys.right = false; playerTargetX = playerX; }
  });
  $('soundToggle').addEventListener('click', () => {
    muted = !muted;
    $('soundToggle').textContent = muted ? '✕' : '♪';
    $('soundToggle').style.color = muted ? '#5a7aa8' : '#2f7dff';
    if (!muted) { ensureAudio(); sfxPick(); }
  });

  // ============================================================
  // 主循环
  // ============================================================
  let lastTs = 0;
  function loop(ts) {
    if (!lastTs) lastTs = ts;
    let dt = (ts - lastTs) / 1000;
    lastTs = ts;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render(ts / 1000);
    requestAnimationFrame(loop);
  }

  function escHtml(v) {
    return String(v).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  let pfFormMode = '';      // '' | 'new' | 'rename'
  let pfRenameId = '';
  let pfDeleteId = '';      // 非空表示该玩家正在等待二次确认删除

  function deleteProfile(id) {
    if (profiles.length <= 1) return;
    const p = profiles.find(function (x) { return x.id === id; });
    if (!p) return;
    profiles = profiles.filter(function (x) { return x.id !== id; });
    saveProfiles();
    if (activeProfileId === id) {
      activeProfileId = profiles[0].id;
      try { localStorage.setItem(PROF_ACTIVE_KEY, activeProfileId); } catch (e) {}
      loadBest();
      updateHUD();
    }
    pfFormMode = '';
    pfRenameId = '';
    showStart();
  }

  function showStart() {
    loadBest();
    const saved = loadProgress();
    const savedNum = saved + 1;
    const renaming = pfFormMode === 'rename'
      ? profiles.find(function (p) { return p.id === pfRenameId; })
      : null;
    const canDelete = profiles.length > 1;
    const chips = profiles.map(function (p) {
      const on = p.id === activeProfileId ? ' on' : '';
      const pid = escHtml(p.id);
      const pending = pfDeleteId === p.id;
      let delPart = '';
      if (canDelete) {
        delPart = pending
          ? `<span class="pf-confirm">
               <span class="pf-ask">删除？</span>
               <button class="pf-mini del" data-del-ok="${pid}">确定</button>
               <button class="pf-mini" data-del-cancel="1">取消</button>
             </span>`
          : `<button class="pf-tool del" data-del="${pid}" title="删除玩家">✕</button>`;
      }
      return `<div class="pf-chip${on}" data-pid="${pid}">
          <span class="pf-row">
            <span class="pf-name">${escHtml(p.name)}</span>
            <button class="pf-tool" data-edit="${pid}" title="修改昵称">✎</button>
          </span>
          <span class="pf-row">
            <span class="pf-lv">第 ${(p.level || 0) + 1} 关</span>
            ${delPart}
          </span>
        </div>`;
    }).join('');

    showOverlay(`
      <h1>小猪别跑！</h1>
      <div class="sub">可爱的猪猪军团 · 等你来扫射</div>
      <div class="pf-box">
        <div class="pf-title">选择玩家</div>
        <div class="pf-list">${chips}<button class="pf-chip add" id="pfAdd">＋ 新玩家</button></div>
        <div class="pf-new${pfFormMode ? ' show' : ''}" id="pfNew">
          <input id="pfName" maxlength="8" value="${renaming ? escHtml(renaming.name) : ''}" placeholder="输入昵称（最多 8 字）" />
          <button class="pf-ok" id="pfOk">${renaming ? '保存' : '创建'}</button>
          <button class="pf-cancel" id="pfCancel">取消</button>
        </div>
      </div>
      <div class="rules">
        <div class="rule"><span class="k">1</span><span>左右移动让小队在路上<em>横移</em>，武器<em>自动开火</em>。</span></div>
        <div class="rule"><span class="k">2</span><span>一排一排的小猪整齐涌来，<em>人数</em>=弹道数量，<em>武器</em>=射速，两种道具<em>每关重置</em>。</span></div>
        <div class="rule"><span class="k">3</span><span>左右两半各有一个道具，<em>站在哪半就必吃哪半</em>，躲不掉，只能力争抢到增益的那边。</span></div>
        <div class="rule"><span class="k">4</span><span>血量 <em>3 点</em> 每关回满，被撞一次扣 1 点，扣完即失败。</span></div>
        <div class="rule"><span class="k">5</span><span>无限关卡：每 <em>10 关 BOSS</em>、每 <em>5 关奖励</em>，偶尔狂暴 / 装甲 / 精英变体。</span></div>
        <div class="rule"><span class="k">6</span><span>每个玩家<em>独立存档</em>，进度保存在本机浏览器，下次打开可接着玩。</span></div>
      </div>
      <div class="btn-row">
        ${saved > 0 ? `<button class="btn" id="continueBtn">继续第 ${savedNum} 关</button>` : ''}
        <button class="btn blue" id="startBtn">${saved > 0 ? '从第 1 关重新开始' : '开始游戏'}</button>
      </div>
    `);

    setTimeout(function () {
      document.querySelectorAll('.pf-chip[data-pid]').forEach(function (el) {
        el.onclick = function (e) {
          if (e.target.closest('.pf-tool')) return;
          if (el.dataset.pid === activeProfileId) return;
          selectProfile(el.dataset.pid);
          pfFormMode = '';
          pfRenameId = '';
          pfDeleteId = '';
          showStart();
        };
      });
      document.querySelectorAll('[data-edit]').forEach(function (btn) {
        btn.onclick = function (e) {
          e.stopPropagation();
          pfFormMode = 'rename';
          pfRenameId = btn.dataset.edit;
          pfDeleteId = '';
          showStart();
          setTimeout(function () {
            const i = $('pfName');
            if (i) { i.focus(); i.select(); }
          }, 20);
        };
      });
      document.querySelectorAll('[data-del]').forEach(function (btn) {
        btn.onclick = function (e) {
          e.stopPropagation();
          pfDeleteId = btn.dataset.del;   // 只进入确认状态，不直接删
          pfFormMode = '';
          pfRenameId = '';
          showStart();
        };
      });
      document.querySelectorAll('[data-del-ok]').forEach(function (btn) {
        btn.onclick = function (e) {
          e.stopPropagation();
          deleteProfile(btn.dataset.delOk);
        };
      });
      document.querySelectorAll('[data-del-cancel]').forEach(function (btn) {
        btn.onclick = function (e) {
          e.stopPropagation();
          pfDeleteId = '';
          showStart();
        };
      });
      const addBtn = $('pfAdd');
      if (addBtn) addBtn.onclick = function () {
        pfFormMode = pfFormMode === 'new' ? '' : 'new';
        pfRenameId = '';
        showStart();
        setTimeout(function () {
          const i = $('pfName');
          if (i) { i.value = ''; i.focus(); }
        }, 20);
      };
      const okBtn = $('pfOk');
      if (okBtn) okBtn.onclick = function () {
        const inp = $('pfName');
        const name = (inp.value || '').trim().slice(0, 8);
        if (!name) { inp.focus(); return; }
        if (pfFormMode === 'rename') {
          const p = profiles.find(function (x) { return x.id === pfRenameId; });
          if (p) { p.name = name; saveProfiles(); }
        } else {
          addProfile(name);
        }
        pfFormMode = '';
        pfRenameId = '';
        pfDeleteId = '';
        showStart();
      };
      const cancelBtn = $('pfCancel');
      if (cancelBtn) cancelBtn.onclick = function () {
        pfFormMode = '';
        pfRenameId = '';
        showStart();
      };
      const nameInput = $('pfName');
      if (nameInput) nameInput.onkeydown = function (e) {
        if (e.key === 'Enter') { e.preventDefault(); if (okBtn) okBtn.click(); }
        if (e.key === 'Escape') { e.preventDefault(); if (cancelBtn) cancelBtn.click(); }
      };
      const b = $('startBtn');
      if (b) b.onclick = function () { ensureAudio(); startGame(); };
      const c = $('continueBtn');
      if (c) c.onclick = function () { ensureAudio(); startRun(saved); };
    }, 30);
  }

  resize();
  buildHearts();
  loadProfiles();
  loadBest();
  updateHUD();
  initClouds();
  showStart();
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
